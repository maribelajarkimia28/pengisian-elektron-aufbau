<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Animasi Konfigurasi Elektron</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#EDF1F7;--card:#fff;--ink:#12203A;--mut:#56637F;--line:#D5DDEA;--s:#3D7BFF;--p:#F5A524;--d:#14B88A;--f:#B05CFF;--bad:#E5484D;--ok:#0E9F77}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--card:#121D38;--ink:#E7EDFA;--mut:#9AA8C7;--line:#243459}}
:root[data-theme="dark"]{--bg:#0A1226;--card:#121D38;--ink:#E7EDFA;--mut:#9AA8C7;--line:#243459}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Figtree,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font:800 clamp(24px,4vw,36px)/1.1 Sora,sans-serif;margin:0 0 6px;letter-spacing:-.02em}.sub{margin:0;color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
nav button{border:0;background:none;color:var(--mut);font:600 14px Figtree,sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--s);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.stage{background:linear-gradient(160deg,#0D1830,#16264E);border-radius:22px;padding:16px;color:#E8EEFF;display:flex;flex-direction:column;gap:12px;min-height:560px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 14px Figtree,sans-serif;color:#9FB2DD}
.badge{background:#ffffff14;border:1px solid #ffffff2a;border-radius:999px;padding:4px 12px;color:#fff;font-weight:700}
.cv{flex:1;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;position:relative;min-height:380px}
.ladder{display:flex;gap:10px;justify-content:center}
.axis{writing-mode:vertical-rl;transform:rotate(180deg);color:#7F93C4;font-size:12px;text-align:center}
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:10px;padding:3px 8px;border-radius:10px;border:1px solid transparent;opacity:.75}
.row.act{opacity:1;background:#ffffff12;border-color:var(--c);box-shadow:0 0 18px -4px var(--c)}
.lb{width:34px;color:var(--c);font:800 15px Sora,sans-serif}.bx{display:flex;gap:6px}
.ob{width:34px;height:34px;border:2px solid var(--c);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;background:#ffffff0a}
.ob.big{width:76px;height:88px;border-radius:14px;cursor:pointer;transition:background .2s}.ob.big:hover{background:#ffffff1c}
.e{font-weight:800;font-size:20px;line-height:1;display:inline-block;text-shadow:0 0 10px var(--c)}.big .e{font-size:46px}
.e.new{animation:drop .9s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{0%{transform:translateY(-80px) scale(2.2);opacity:0}60%{opacity:1}100%{transform:none}}
.shake{animation:shake .5s;border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.ghost{position:absolute;top:70px;left:calc(50% - 140px);color:var(--bad);font-size:46px;text-shadow:0 0 12px var(--bad);animation:bn 1.4s forwards}
@keyframes bn{0%{transform:translateX(-20px);opacity:0}25%{opacity:1}55%{transform:translateX(105px)}100%{transform:translateX(-30px);opacity:0}}
.ct{font-size:12px;color:#8FA3D3;width:38px}.cap{font-size:13px;color:#9FB2DD;text-align:center}
.qn{border-collapse:collapse;font-size:14px;color:#fff}.qn td,.qn th{padding:4px 12px;text-align:center;border-bottom:1px solid #ffffff22}.qn th{color:#9FB2DD;font-weight:600}.qn .x td{color:#FF8A8F;text-decoration:line-through}.qn b{color:#7EF0C9}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.lab{font-size:13px;color:#9FB2DD}
.btn{border:0;border-radius:12px;padding:10px 14px;font:700 14px Figtree,sans-serif;cursor:pointer;background:#ffffff1f;color:#fff}.btn.pri{background:var(--s)}.btn:hover{filter:brightness(1.2)}
select.btn{background:#22346A;padding:9px 8px}
.txt{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.txt h2{font:800 22px/1.25 Sora,sans-serif;margin:0 0 10px}.txt h3{font:700 14px Figtree,sans-serif;color:var(--mut);margin:18px 0 8px}.txt p{margin:8px 0}
.tag{display:inline-block;padding:1px 10px;border-radius:8px;color:#fff;background:var(--c);font-weight:700}
.note{border-left:4px solid var(--c,var(--s));background:var(--bg);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0}.note.err{--c:var(--bad)}.note.ok{--c:var(--ok)}
.cfg{font:700 19px/1.5 Sora,sans-serif;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:2px 9px;border-radius:8px;border:1.5px solid var(--c);color:var(--c);font-size:13px;font-weight:700}.chip.done{background:var(--c);color:#fff}.chip.now{outline:3px solid color-mix(in srgb,var(--c) 35%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;max-width:820px}
.card h2{font:800 22px Sora,sans-serif;margin:0 0 8px}.card p{margin:6px 0}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px Figtree,sans-serif;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .opt{width:auto;margin:0}.seg .opt.on{border-color:var(--s);background:color-mix(in srgb,var(--s) 22%,var(--card))}
textarea{width:100%;min-height:80px;margin-top:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:15px Figtree,sans-serif}
.hr{display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:100%}@media(max-width:860px){.hr{align-items:flex-start}}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.tool{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px Figtree,sans-serif;padding:7px 12px;border-radius:10px;cursor:pointer}.tool[aria-pressed=true]{background:var(--s);color:#fff;border-color:var(--s)}
.vp{width:min(92vw,560px);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;color:var(--ink);font-size:13px}.vp select{max-width:100%}.vp input{vertical-align:middle;width:110px}.vp small{flex-basis:100%;color:var(--mut)}
.wide .wrap,:fullscreen .wrap{max-width:none}.wide .stage,:fullscreen .stage{min-height:calc(100vh - 150px)}:fullscreen{overflow:auto;background:var(--bg)}
.ar{fill:none;stroke:#7EF0C9;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;opacity:.9}.ar.now{stroke-dashoffset:1;animation:dr 1.6s .1s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.hd{fill:#7EF0C9}.hd.now{animation:fi .01s 1.7s backwards}@keyframes fi{from{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pp .9s}@keyframes pp{0%{transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body><div class="wrap">
<header><div><h1>Konfigurasi Elektron</h1><p class="sub">Aufbau, Hund, dan Pauli: lihat, dengar, coba sendiri, lalu pahami.</p></div><div class="hr"><div id="tools" class="tools"></div><nav id="nav"></nav></div></header>
<main id="view"></main></div>
<script>
const $=s=>document.querySelector(s),sup=n=>[...String(n)].map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join('');
const EL='H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe'.split(' ');
const SH='1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p'.split(' ').map(x=>{const n=+x[0],t=x[1],l='spdf'.indexOf(t),o=2*l+1;return{x,n,t,l,o,cap:2*o}});
const occ=n=>SH.map(h=>{const c=Math.min(h.cap,n);n-=c;return c});
const shellOf=n=>{let i=0;while(n>SH[i].cap){n-=SH[i].cap;i++}return i};
const TABS=[['diagram','1 Diagram'],['aufbau','2 Aufbau'],['hund','3 Hund'],['pauli','4 Pauli'],['latihan','5 Latihan'],['refleksi','6 Refleksi']];
const newH=t=>({t,bx:Array.from({length:t=='p'?3:5},()=>[]),hist:[],msg:null,last:null,shake:null});
const newP=()=>({bx:[],ghost:null,msg:null,sc:0});
const S={tab:'diagram',spd:2600,timer:null,voice:false,said:'',vs:false,vo:{name:'',rate:.95,pitch:1},d:{k:0},a:{n:0,tgt:20},h:newH('p'),p:newP(),q:{},r:{}};
const el=(s,nw)=>`<i class="e${nw?' new':''}">${s=='u'?'↑':'↓'}</i>`;
const boxesFor=(c,o,nw)=>Array.from({length:o},(_,b)=>{let h='';for(let i=0;i<c;i++)if((i<o?i:i-o)==b)h+=el(i<o?'u':'d',nw&&i==c-1);return`<div class="ob">${h}</div>`}).join('');
const SPD=()=>`<select class="btn" data-c="spd" aria-label="Kecepatan">${[[2600,'Pelan'],[1500,'Sedang'],[800,'Cepat']].map(([v,l])=>`<option value="${v}"${S.spd==v?' selected':''}>${l}</option>`).join('')}</select>`;
const PLAY=l=>`<button class="btn pri" data-a="play">${S.timer?'⏸ Jeda':'⏵ '+l}</button>`;

/* ---------- DIAGRAM ---------- */
const DG=[];for(let s=1;s<=8;s++){const g=[];for(let n=1;n<=7;n++){const l=s-n;if(l>=0&&l<4&&l<n)g.push({n,l,x:'spdf'[l]})}DG.push(g)}
{let c=0;DG.forEach(g=>g.forEach(q=>q.i=++c))}
const DX=l=>110+l*118,DY=n=>44+(n-1)*50;
function vD(){const k=S.d.k;let s=`<svg viewBox="0 0 540 400" style="width:100%;max-width:560px" role="img" aria-label="Diagram urutan subkulit">`;
[...'spdf'].forEach((t,l)=>s+=`<text x="${DX(l)}" y="16" text-anchor="middle" font-size="17" font-weight="800" style="fill:var(--${t})">${t}</text>`);
for(let n=1;n<=7;n++)s+=`<text x="14" y="${DY(n)+5}" font-size="13" style="fill:#8FA3D3">n = ${n}</text>`;
DG.forEach((g,gi)=>g.forEach(q=>{const on=gi<k,x=DX(q.l),y=DY(q.n);s+=`<g class="${gi==k-1?'pop':''}"><rect x="${x-42}" y="${y-17}" width="84" height="34" rx="9" stroke-width="2" style="stroke:var(--${q.x});fill:${on?`var(--${q.x})`:'#ffffff0d'};opacity:${on?1:.5}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">${q.n}${q.x}</text>${on?`<circle cx="${x+40}" cy="${y-17}" r="10" fill="#fff"/><text x="${x+40}" y="${y-13}" text-anchor="middle" font-size="11" font-weight="800" fill="#0D1830">${q.i}</text>`:''}</g>`}));
DG.slice(0,k).forEach((g,gi)=>{const a=g[0],b=g[g.length-1],x1=DX(a.l)+57,y1=DY(a.n)-25,x2=DX(b.l)-57,y2=DY(b.n)+25,now=gi==k-1,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,bx=x2-12*ux,by=y2-12*uy;
s+=`<path class="ar${now?' now':''}" pathLength="1" d="M${x1} ${y1}L${x2} ${y2}"/><polygon class="hd${now?' now':''}" points="${x2},${y2} ${bx-5*uy},${by+5*ux} ${bx+5*uy},${by-5*ux}"/>`});
return s+'</svg>'+`<div class="cap">Angka putih = urutan pengisian. Panah dibaca dari kanan-atas ke kiri-bawah.</div>`}
function cD(){return`<button class="btn" data-a="reset">⟲ Ulang</button><button class="btn" data-a="back">◀</button><button class="btn" data-a="next">Langkah ▶</button>${PLAY('Putar')}${SPD()}<button class="btn" data-a="tab" data-v="aufbau">Lanjut ke Aufbau ▶▶</button>`}
function tD(){const k=S.d.k;let b=`<h2>${k?'Panah ke-'+k:'Diagram coret miring'}</h2>`;
if(!k)b+=`<p>Ini <b>cara cepat</b> mengingat urutan tingkat energi subkulit tanpa menghafal.</p><div class="note"><b>Caranya:</b> (1) tulis subkulit tiap kulit n: s, p, d, f. (2) Tarik panah miring dari kanan-atas ke kiri-bawah. (3) Baca urutannya dari panah pertama sampai terakhir.</div><p>Tekan <b>⏵ Putar</b> atau <b>Langkah ▶</b>. Satu panah digambar pada satu waktu.</p>`;
else{const g=DG[k-1];b+=`<p>Panah ini melewati ${g.map(q=>`<b>${q.n}${q.x}</b>`).join(', lalu ')}${g.length>1?'':' saja'}. Semua subkulit pada panah ini punya n + ℓ = ${k}.</p>`;
if(k==4)b+=`<div class="note">Perhatikan: 3p lalu 4s dalam satu panah. Subkulit 3d baru ada di panah berikutnya, jadi <b>4s lebih dulu dari 3d</b>.</div>`;
if(k==8)b+=`<div class="note ok">Selesai! Urutan lengkap tingkat energi subkulit:</div><div class="cfg">${DG.flat().map(q=>q.n+q.x).join(' → ')}</div><p><button class="opt" style="width:auto" data-a="tab" data-v="aufbau">Lanjut ke animasi Aufbau</button></p>`;
b+=`<h3>Urutan yang sudah didapat</h3><div class="chips">${DG.slice(0,k).flat().map(q=>`<span class="chip done" style="--c:var(--${q.x})">${q.n}${q.x}</span>`).join('')}</div>`}
return b}
function dStep(){S.d.k=Math.min(8,S.d.k+1);render();return S.d.k<8}

/* ---------- AUFBAU ---------- */
function vA(){const n=S.a.n,cn=occ(n),cur=n?shellOf(n):-1;
return`<div class="ladder"><div class="axis">Energi: rendah di bawah → tinggi di atas</div><div class="rows">`+SH.map((_,i)=>i).reverse().map(i=>{const h=SH[i];return`<div class="row${i==cur?' act':''}" style="--c:var(--${h.t})"><b class="lb">${h.x}</b><div class="bx">${boxesFor(cn[i],h.o,i==cur)}</div><span class="ct">${cn[i]}/${h.cap}</span></div>`}).join('')+`</div></div>`}
function cA(){return`<button class="btn" data-a="reset">⟲ Ulang</button><button class="btn" data-a="back">◀</button><button class="btn" data-a="next">Langkah ▶</button>${PLAY('Putar')}${SPD()}<label class="lab">Sampai <select class="btn" data-c="tgt">${EL.map((s,i)=>`<option value="${i+1}"${S.a.tgt==i+1?' selected':''}>${i+1} ${s}</option>`).join('')}</select></label>`}
function tA(){const n=S.a.n,cn=occ(n),cur=n?shellOf(n):-1;let b;
if(!n)b=`<h2>Prinsip Aufbau</h2><p><b>Aufbau</b> berarti "membangun" (bahasa Jerman). Elektron mengisi subkulit dari tingkat energi <b>terendah</b> lebih dulu, baru naik ke tingkat berikutnya.</p><div class="note">Urutan energi ditentukan oleh nilai <b>n + ℓ</b>. Jika n + ℓ sama, subkulit dengan n lebih kecil terisi lebih dulu.</div><p>Tekan <b>⏵ Putar</b> untuk melihat elektron masuk satu per satu, atau <b>Langkah ▶</b> untuk maju manual. Pilih unsur tujuan di menu <b>Sampai</b>.</p>`;
else{const h=SH[cur],c=cn[cur],pv=SH[cur-1];
b=`<h2>Elektron ke-${n} masuk ke <span class="tag" style="--c:var(--${h.t})">${h.x}</span></h2><p>`;
b+=c==1?`${pv?`Subkulit ${pv.x} sudah penuh, jadi elektron naik ke tingkat energi berikutnya: `:''}<b>${h.x}</b> (n + ℓ = ${h.n+h.l}) mulai terisi.`:c<=h.o?`Subkulit ${h.x} punya ${h.o} orbital. Elektron masuk ke orbital kosong berikutnya dengan spin ↑ (aturan Hund).`:`Semua orbital ${h.x} sudah berisi satu elektron, jadi elektron ini berpasangan dengan spin ↓ (larangan Pauli).`;
b+='</p>';
if(h.x=='4s'&&c==1)b+=`<div class="note">Perhatikan: 4s (n + ℓ = 4) lebih rendah daripada 3d (n + ℓ = 5), maka 4s terisi <b>sebelum</b> 3d.</div>`;
if(h.x=='3d'&&c==1)b+=`<div class="note">4s sudah penuh. Barulah 3d mulai terisi.</div>`;
if(c==h.cap)b+=`<div class="note ok">Subkulit ${h.x} penuh (${h.cap} elektron). Elektron berikutnya pindah ke subkulit di atasnya.</div>`;
if(n==24||n==29)b+=`<div class="note err">Catatan: Cr dan Cu sebenarnya memakai konfigurasi pengecualian ([Ar] 3d⁵ 4s¹ dan [Ar] 3d¹⁰ 4s¹) karena subkulit setengah penuh atau penuh lebih stabil. Animasi ini menunjukkan pola dasar.</div>`;
b+=`<h3>Konfigurasi atom ${EL[n-1]} (Z = ${n})</h3><div class="cfg">${SH.map((h,i)=>cn[i]?h.x+sup(cn[i]):'').filter(Boolean).join(' ')}</div>`}
b+=`<h3>Urutan Aufbau (angka kecil = n + ℓ)</h3><div class="chips">${SH.map((h,i)=>`<span class="chip${n&&cn[i]==h.cap?' done':''}${i==cur?' now':''}" style="--c:var(--${h.t})">${h.x}<small>${h.n+h.l}</small></span>`).join('')}</div>`;
return b}

/* ---------- HUND ---------- */
function vH(){const H=S.h;return`<div class="bx" style="gap:12px" id="hb">${H.bx.map((b,i)=>`<div class="ob big${H.shake==i?' shake':''}" role="button" tabindex="0" aria-label="Orbital ${i+1}" data-a="hb" data-v="${i}" style="--c:var(--${H.t})">${b.map((s,k)=>el(s,H.last&&H.last[0]==i&&H.last[1]==k)).join('')}</div>`).join('')}</div><div class="cap">Orbital ${H.t=='p'?'2p':'3d'}: semua kotak memiliki energi yang sama.<br>Klik sebuah kotak untuk menambah elektron.</div>`}
function cH(){return`<button class="btn" data-a="reset">⟲ Ulang</button><button class="btn" data-a="undo">◀ Urungkan</button>${PLAY('Isi otomatis')}${SPD()}<label class="lab">Subkulit <select class="btn" data-c="ht"><option value="p"${S.h.t=='p'?' selected':''}>p (3 orbital)</option><option value="d"${S.h.t=='d'?' selected':''}>d (5 orbital)</option></select></label>`}
function tH(){const H=S.h,o=H.bx.length,k=H.bx.flat().length,u=H.bx.filter(x=>x.length==1).length,t=H.t;
const ex=t=='p'?['B','C','N','O','F','Ne']:['Sc','Ti','V','Cr*','Mn','Fe','Co','Ni','Cu*','Zn'];
let b=`<h2>Aturan Hund</h2>`;
if(!k&&!H.msg)b+=`<p>Orbital dalam satu subkulit memiliki energi yang sama. Menurut <b>aturan Hund</b>, elektron mengisi orbital <b>satu per satu</b> dengan spin searah (↑) lebih dulu. Elektron baru berpasangan setelah semua orbital berisi satu elektron.</p><div class="note">Alasannya: dua elektron dalam satu orbital saling tolak lebih kuat. Dengan menyebar, atom menjadi lebih stabil.</div><p><b>Coba sendiri:</b> klik kotak orbital. Coba juga langsung memasangkan elektron saat masih ada kotak kosong.</p>`;
if(H.msg)b+=`<div class="note err"><b>Belum tepat.</b> ${H.msg}</div>`;
else if(k)b+=`<p>${k<=o?`Elektron ke-${k} menempati orbital <b>kosong</b> dengan spin ↑. Spin searah dengan elektron lain, tolakan paling kecil.`:`Semua ${o} orbital sudah berisi satu elektron. Baru sekarang elektron ke-${k} boleh berpasangan dengan spin ↓.`}</p>`+(k==2*o?`<div class="note ok">Subkulit penuh: semua elektron berpasangan.</div>`:'');
if(k)b+=`<h3>Ringkasan</h3><div class="cfg">${t=='p'?'2p':'3d'}${sup(k)}</div><p>Elektron tak berpasangan: <b>${u}</b>${ex[k-1]&&!H.msg?` &nbsp;·&nbsp; contoh unsur: <b>${ex[k-1]}</b>`:''}</p>${t=='d'?'<p><small>* pengecualian konfigurasi.</small></p>':''}`;
return b}
function hClick(i){const H=S.h,b=H.bx,em=b.some(x=>!x.length);H.last=null;H.shake=null;H.msg=null;
if(b[i].length==2){H.msg='Orbital ini sudah penuh. Satu orbital maksimum 2 elektron (larangan Pauli).';H.shake=i}
else if(b[i].length==1&&em){H.msg='Masih ada orbital kosong, jadi jangan berpasangan dulu. Isi tiap orbital dengan satu elektron berspin ↑ terlebih dahulu.';H.shake=i}
else{H.hist.push(JSON.stringify(b));b[i].push(b[i].length?'d':'u');H.last=[i,b[i].length-1]}
render()}
function hAuto(){const b=S.h.bx;let i=b.findIndex(x=>!x.length);if(i<0)i=b.findIndex(x=>x.length==1);if(i<0)return false;hClick(i);return b.flat().length<b.length*2}

/* ---------- PAULI ---------- */
const MS={u:'+½',d:'−½'};
function vP(){const P=S.p;return`${P.ghost?`<i class="e ghost">${P.ghost=='u'?'↑':'↓'}</i>`:''}<div class="ob big${P.ghost?' shake':''}" style="--c:var(--s);margin-top:50px">${P.bx.map((s,k)=>el(s,k==P.bx.length-1&&!P.ghost)).join('')}</div><div class="cap">Satu orbital 1s</div><table class="qn"><tr><th></th><th>n</th><th>ℓ</th><th>mℓ</th><th>ms</th></tr>${P.bx.map((s,k)=>`<tr><td>e⁻ ${k+1}</td><td>1</td><td>0</td><td>0</td><td><b>${MS[s]}</b></td></tr>`).join('')}${P.ghost?`<tr class="x"><td>e⁻ ${P.bx.length+1}</td><td>1</td><td>0</td><td>0</td><td>${MS[P.ghost]}</td></tr>`:''}</table>`}
function cP(){return`<button class="btn" data-a="reset">⟲ Ulang</button><button class="btn" data-a="sp" data-v="u">+ elektron ↑</button><button class="btn" data-a="sp" data-v="d">+ elektron ↓</button>${PLAY('Putar demo')}${SPD()}`}
function tP(){const P=S.p,k=P.bx.length;let b='<h2>Larangan Pauli</h2>';
if(!k&&!P.msg)b+=`<p>Dalam satu atom, <b>tidak boleh ada dua elektron</b> dengan keempat bilangan kuantum (n, ℓ, mℓ, ms) yang sama.</p><div class="note">Akibatnya, satu orbital hanya muat <b>2 elektron</b>, dan keduanya harus berspin <b>berlawanan</b> (↑↓).</div><p>Tekan <b>⏵ Putar demo</b> untuk skenario terpandu, atau coba tombol ↑ dan ↓ sendiri.</p>`;
if(P.msg)b+=`<div class="note err"><b>Ditolak!</b> ${P.msg}</div><p>Lihat baris merah pada tabel: keempat bilangan kuantumnya kembar dengan elektron lain.</p>`;
else if(k==1)b+=`<p>Elektron pertama masuk: n = 1, ℓ = 0, mℓ = 0, ms = ${MS[P.bx[0]]}. Belum ada masalah.</p>`;
else if(k==2)b+=`<div class="note ok">Elektron kedua masuk dengan spin <b>berlawanan</b> (ms = ${MS[P.bx[1]]}). Ada satu bilangan kuantum yang berbeda, jadi diizinkan.</div><p>Orbital ini sekarang penuh.</p>`;
if(k==2)b+=`<h3>Kesimpulan</h3><p>Orbital s (1 orbital) menampung 2 elektron, p (3 orbital) 6 elektron, d (5 orbital) 10 elektron, f (7 orbital) 14 elektron.</p>`;
return b}
function pClick(s){const P=S.p,b=P.bx;P.ghost=null;P.msg=null;
if(b.length==2){P.ghost=s;P.msg='Orbital sudah berisi dua elektron (↑↓). Elektron ke-3 harus pindah ke orbital lain yang energinya lebih tinggi.'}
else if(b[0]==s){P.ghost=s;P.msg='Spin sama dengan elektron pertama, sehingga n, ℓ, mℓ, dan ms sama semua.'}
else b.push(s);render()}
function pAuto(){const P=S.p,sc=['u','u','d','u'];if(P.sc>=4)return false;pClick(sc[P.sc++]);return P.sc<4}

/* ---------- LATIHAN ---------- */
const QS=[
['Pada diagram coret miring, setiap panah dibaca dari arah…',['kiri-bawah ke kanan-atas','kanan-atas ke kiri-bawah','atas ke bawah secara lurus','kiri ke kanan secara mendatar'],1,'Setiap panah dibaca dari ujung kanan-atas (n kecil) ke ujung kiri-bawah. Panah-panahnya sendiri dibaca berurutan dari yang paling atas.'],
['Menurut diagram coret miring, subkulit yang terisi tepat setelah 4s adalah…',['4p','3d','5s','4d'],1,'Panah ke-4 melewati 3p lalu 4s. Panah berikutnya melewati 3d, 4p, lalu 5s, sehingga 3d terisi tepat setelah 4s.'],
['Subkulit-subkulit yang dilewati oleh satu panah yang sama selalu memiliki…',['nilai n yang sama','nilai ℓ yang sama','nilai n + ℓ yang sama','jumlah orbital yang sama'],2,'Satu panah menghubungkan subkulit dengan n + ℓ sama, misalnya 3d, 4p, 5s semuanya bernilai 5. Dalam satu panah, n yang lebih kecil terisi lebih dulu.'],
['Urutan pengisian subkulit setelah 5p menurut diagram coret miring adalah…',['4f, 5d, 6s, 6p','6s, 4f, 5d, 6p','6s, 5d, 4f, 6p','5d, 6s, 4f, 6p'],1,'Panah ke-6 berakhir di 6s. Panah ke-7 melewati 4f, 5d, 6p, lalu 7s, jadi urutannya 6s, 4f, 5d, 6p.'],
['Urutan pengisian subkulit yang benar menurut Aufbau adalah…',['1s, 2s, 2p, 3s, 3p, 3d, 4s','1s, 2s, 2p, 3s, 3p, 4s, 3d','1s, 2s, 3s, 2p, 3p, 4s, 3d','1s, 2p, 2s, 3s, 3p, 4s, 3d'],1,'4s (n + ℓ = 4) berenergi lebih rendah daripada 3d (n + ℓ = 5), sehingga 4s terisi lebih dulu.'],
['Konfigurasi elektron atom Ca (Z = 20) adalah…',['1s² 2s² 2p⁶ 3s² 3p⁶ 3d²','1s² 2s² 2p⁶ 3s² 3p⁶ 4s²','1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹ 3d¹','1s² 2s² 2p⁸ 3s² 3p⁶ 4s²'],1,'Setelah 3p penuh (18 elektron), dua elektron terakhir mengisi 4s. Subkulit p maksimum 6 elektron, jadi 2p⁸ tidak mungkin.'],
['Jumlah elektron maksimum pada subkulit d adalah…',['6','10','14','2'],1,'Subkulit d punya 5 orbital, masing-masing maksimum 2 elektron: 5 × 2 = 10.'],
['Atom nitrogen (Z = 7) berkonfigurasi 2p³. Susunan orbital 2p yang benar adalah…',['↑↓ | ↑ | –','↑ | ↑ | ↑','↑↓ | ↓ | –','↑ | ↑ | ↓'],1,'Aturan Hund: tiga elektron menempati tiga orbital berbeda dengan spin searah sebelum ada yang berpasangan.'],
['Pernyataan "tidak ada dua elektron dengan keempat bilangan kuantum yang sama" dikenal sebagai…',['Asas Aufbau','Aturan Hund','Larangan Pauli','Asas Heisenberg'],2,'Itulah larangan (azas eksklusi) Pauli. Ia membatasi satu orbital maksimum 2 elektron berspin berlawanan.'],
['Jumlah elektron tak berpasangan pada atom Fe (Z = 26, 3d⁶) adalah…',['2','4','6','0'],1,'Lima orbital 3d masing-masing mendapat ↑ lebih dulu, elektron ke-6 berpasangan di satu orbital. Tersisa 4 orbital dengan satu elektron.'],
['Dua elektron dalam satu orbital 1s memiliki bilangan kuantum yang berbeda pada…',['n','ℓ','mℓ','ms'],3,'n, ℓ, dan mℓ ditentukan oleh orbitalnya (sama untuk keduanya). Hanya spin (ms) yang boleh berbeda: +½ dan −½.']];
function vQ(){const ans=Object.keys(S.q).length,sc=Object.entries(S.q).filter(([i,o])=>QS[i][2]==o).length;
return`<div class="card"><h2>Latihan soal</h2><p>Pilih jawaban, penjelasan langsung muncul. Skor: <b>${sc}/${QS.length}</b> (${ans} dijawab)</p></div>`+QS.map((q,i)=>{const a=S.q[i];return`<div class="card"><p><b>${i+1}. ${q[0]}</b></p>${q[1].map((o,j)=>`<button class="opt${a!==undefined?(j==q[2]?' right':j==a?' wrong':''):''}" data-a="ans" data-v="${i},${j}"${a!==undefined?' disabled':''}>${o}</button>`).join('')}${a!==undefined?`<div class="note ${a==q[2]?'ok':'err'}"><b>${a==q[2]?'Benar!':'Belum tepat.'}</b> ${q[3]}</div>`:''}</div>`}).join('')+(ans==QS.length?`<div class="card"><h2>${sc>=9?'Hebat!':sc>=6?'Sudah bagus.':'Ayo ulangi animasinya.'}</h2><p>Kamu menjawab benar ${sc} dari ${QS.length} soal. ${sc<QS.length?'Buka kembali tab animasi untuk bagian yang masih terasa sulit.':'Lanjutkan ke refleksi.'}</p><button class="opt" style="width:auto" data-a="qreset">⟲ Ulangi latihan</button> <button class="opt" style="width:auto" data-a="tab" data-v="refleksi">Lanjut ke refleksi</button></div>`:'')}

/* ---------- REFLEKSI ---------- */
const RT=[['diagram','Diagram coret miring'],['aufbau','Aufbau'],['hund','Hund'],['pauli','Pauli']],LV=['Sudah paham','Hampir paham','Perlu ulang'];
const RP=['Jelaskan dengan kata-katamu sendiri cara memakai diagram coret miring untuk menentukan urutan pengisian subkulit. Mengapa cara ini sesuai dengan aturan n + ℓ?','Mengapa 4s terisi lebih dulu daripada 3d? Jelaskan dengan kata-katamu sendiri.','Buat analogi sehari-hari untuk aturan Hund (misalnya penumpang yang memilih kursi bus).','Apa yang terjadi jika larangan Pauli tidak berlaku? Berapa elektron yang bisa menempati kulit pertama?','Bagian mana yang masih membingungkan, dan apa langkahmu untuk memahaminya?'];
function vR(){return`<div class="card"><h2>Refleksi</h2><p>Tulis jawabanmu dengan kata-kata sendiri. Tidak ada jawaban salah di sini.</p></div>`+RP.map((p,i)=>`<div class="card"><p><b>${i+1}. ${p}</b></p><textarea aria-label="Jawaban ${i+1}" placeholder="Tulis di sini…"></textarea></div>`).join('')+`<div class="card"><h2>Seberapa paham kamu?</h2>${RT.map(([k,l])=>`<p><b>${l}</b></p><div class="seg">${LV.map((v,j)=>`<button class="opt" data-a="conf" data-t="${k}" data-v="${j}">${v}</button>`).join('')}</div>`).join('')}<p></p><button class="opt" style="width:auto" data-a="fin">Lihat rekomendasi belajar</button><div id="rmsg"></div></div>`}

/* ---------- RENDER & EVENTS ---------- */
function render(){
$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab==k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('');
const t=S.tab,V=$('#view');
$('#tools').innerHTML=`<button class="tool" data-a="voice" aria-pressed="${S.voice}">${S.voice?'🔊 Suara: nyala':'🔈 Suara: mati'}</button><button class="tool" data-a="fs">⛶ ${document.fullscreenElement||document.documentElement.classList.contains('wide')?'Keluar layar penuh':'Layar penuh'}</button><button class="tool" data-a="vset" aria-pressed="${S.vs}">⚙ Pengaturan suara</button><span id="vh"></span>${S.vs?vPanel():''}`;
if(t=='latihan'||t=='refleksi'){V.innerHTML=t=='latihan'?vQ():vR();S.said='';window.speechSynthesis&&speechSynthesis.cancel();return}
const m={diagram:['Diagram urutan energi',vD,cD,tD,`panah ${S.d.k}/8`],aufbau:['Animasi pengisian Aufbau',vA,cA,tA,`Z = ${S.a.n} ${S.a.n?EL[S.a.n-1]:''}`],hund:['Animasi aturan Hund',vH,cH,tH,`${S.h.bx.flat().length} elektron`],pauli:['Animasi larangan Pauli',vP,cP,tP,`${S.p.bx.length} elektron`]}[t];
V.innerHTML=`<div class="grid"><section class="stage" aria-label="Animasi"><div class="sh"><span>${m[0]}</span><span class="badge">${m[4]}</span></div><div class="cv">${m[1]()}</div><div class="ctrl">${m[2]()}</div></section><section class="txt" aria-live="polite">${m[3]()}</section></div>`;say()}
function stop(keep){clearTimeout(S.timer);S.timer=null;if(!keep&&window.speechSynthesis)speechSynthesis.cancel()}
function tick(){if({diagram:dStep,aufbau:aStep,hund:hAuto,pauli:pAuto}[S.tab]()===false){stop(true);render()}}
function loop(){S.timer=setTimeout(function w(){if(S.voice&&window.speechSynthesis&&speechSynthesis.speaking){S.timer=setTimeout(w,300);return}tick();if(S.timer)loop()},S.spd)}
const isId=v=>/^(id|in)([-_]|$)/i.test(v.lang),vq=v=>/natural|online|neural/i.test(v.name)?1:0;
function vList(){const a=window.speechSynthesis?speechSynthesis.getVoices():[];return{id:a.filter(isId).sort((x,y)=>vq(y)-vq(x)),other:a.filter(v=>!isId(v))}}
function pickVoice(){const{id,other}=vList();return[...id,...other].find(v=>v.name==S.vo.name)||id[0]||null}
function vPanel(){const{id,other}=vList(),cur=pickVoice(),o=v=>`<option value="${v.name.replace(/"/g,'&quot;')}"${cur&&cur.name==v.name?' selected':''}>${v.name}${vq(v)?' ★':''}</option>`;
return`<div class="vp"><label>Suara <select class="tool" data-c="vname">${id.length?`<optgroup label="Bahasa Indonesia">${id.map(o).join('')}</optgroup>`:''}${other.length?`<optgroup label="Bahasa lain">${other.map(o).join('')}</optgroup>`:''}</select></label><label>Kecepatan <input type="range" min="0.6" max="1.3" step="0.05" value="${S.vo.rate}" data-c="vrate"> ${S.vo.rate}×</label><label>Nada <input type="range" min="0.7" max="1.4" step="0.05" value="${S.vo.pitch}" data-c="vpitch"> ${S.vo.pitch}</label><button class="tool" data-a="vtest">▶ Coba suara</button><small>★ = suara berkualitas lebih baik (Natural/Online/Neural), otomatis diprioritaskan. ${id.length?'':'Perangkat ini belum punya suara Bahasa Indonesia. '}Pilihan suara bergantung pada perangkat dan browser.</small></div>`}
function say(){const ss=window.speechSynthesis;if(!S.voice||!ss)return;
const t=[...document.querySelectorAll('.txt h2,.txt p,.txt .note,.txt .cfg')].map(x=>x.textContent).join('. ').replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,m=>' pangkat '+[...m].map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)).join('')+' ').replace(/→/g,', lalu ').replace(/↑/g,' panah atas ').replace(/↓/g,' panah bawah ').replace(/n \+ ℓ/g,'n tambah el').replace(/mℓ/g,'em el').replace(/ℓ/g,'el').replace(/\bms\b/g,'em es').replace(/½/g,' setengah').replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/=/g,' sama dengan ').replace(/e⁻/g,'elektron').replace(/[·*()\[\]]/g,' ');
if(t===S.said)return;S.said=t;ss.cancel();const u=new SpeechSynthesisUtterance(t);const v=pickVoice();u.lang=v?v.lang:'id-ID';u.rate=S.vo.rate;u.pitch=S.vo.pitch;if(v)u.voice=v;ss.speak(u)}
function aStep(){const a=S.a;if(a.n<54)a.n++;render();return a.n<a.tgt&&a.n<54}
const act={
tab(v){stop();S.tab=v;render();scrollTo(0,0)},
reset(){stop();if(S.tab=='diagram')S.d.k=0;if(S.tab=='aufbau')S.a.n=0;if(S.tab=='hund')S.h=newH(S.h.t);if(S.tab=='pauli')S.p=newP();render()},
back(){stop();if(S.tab=='diagram'){if(S.d.k>0)S.d.k--}else if(S.a.n>0)S.a.n--;render()},
next(){stop();S.tab=='diagram'?dStep():aStep()},
vset(){S.vs=!S.vs;render()},
vtest(){const ss=window.speechSynthesis;if(!ss)return;ss.cancel();const u=new SpeechSynthesisUtterance('Halo! Ini contoh suara narasi untuk pelajaran konfigurasi elektron.'),v=pickVoice();u.lang=v?v.lang:'id-ID';u.rate=S.vo.rate;u.pitch=S.vo.pitch;if(v)u.voice=v;ss.speak(u)},
voice(){const ss=window.speechSynthesis;if(!ss)return alert('Browser ini belum mendukung suara.');S.voice=!S.voice;S.said='';if(!S.voice)ss.cancel();render();if(S.voice&&!ss.getVoices().some(v=>v.lang.toLowerCase().startsWith('id')))$('#vh').textContent='Suara Bahasa Indonesia belum terpasang di perangkat ini; narasi mungkin memakai suara lain.'},
fs(){const d=document.documentElement;if(document.fullscreenElement)return document.exitFullscreen();if(d.classList.contains('wide')){d.classList.remove('wide');return render()}(d.requestFullscreen?d.requestFullscreen():Promise.reject()).catch(()=>{d.classList.add('wide');render()})},
undo(){stop();const H=S.h;if(H.hist.length){H.bx=JSON.parse(H.hist.pop());H.last=null;H.msg=null;H.shake=null}render()},
play(){if(S.timer)return stop(),render();
if(S.tab=='diagram'&&S.d.k>=8)S.d.k=0;
if(S.tab=='aufbau'&&S.a.n>=S.a.tgt)S.a.n=0;
if(S.tab=='hund'&&S.h.bx.flat().length>=S.h.bx.length*2)S.h=newH(S.h.t);
if(S.tab=='pauli'&&S.p.sc>=4)S.p=newP();
S.timer=true;tick();if(S.timer)loop()},
hb(v){stop();hClick(+v)},sp(v){stop();pClick(v)},
ans(v){const[i,j]=v.split(',');S.q[i]=+j;render()},qreset(){S.q={};render();scrollTo(0,0)},
conf(v,b){S.r[b.dataset.t]=+v;b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x==b))},
fin(){const need=RT.filter(([k])=>S.r[k]!==0);$('#rmsg').innerHTML=need.length?`<div class="note"><b>Saran:</b> ulangi animasi untuk topik yang belum mantap, lalu kerjakan kembali latihan.<div class="seg" style="margin-top:8px">${need.map(([k,l])=>`<button class="opt" data-a="tab" data-v="${k}">Ulangi ${l}</button>`).join('')}</div></div>`:`<div class="note ok"><b>Luar biasa!</b> Coba jelaskan ketiga aturan ini kepada temanmu. Mengajarkan adalah cara terbaik untuk menguatkan pemahaman.</div>`}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v,b)});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.dataset&&e.target.dataset.a=='hb'){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;
if(c=='spd'){S.spd=+v;if(S.timer){clearTimeout(S.timer);loop()}}
if(c=='tgt')S.a.tgt=+v;if(c=='ht'){stop();S.h=newH(v)}
if(c=='vname'){S.vo.name=v;act.vtest()}if(c=='vrate'){S.vo.rate=+v;act.vtest()}if(c=='vpitch'){S.vo.pitch=+v;act.vtest()}render()});
document.addEventListener('fullscreenchange',render);
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{if(S.vs)render()};
render();
</script></body></html>
